{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>История</title>
</head>
<body class="page">
    <h1 class="title">Мои истории</h1>
    {% for i in histories %}
        <p class="text">Кошелёк {{ i.wallet_id.id }} — {{ i.type_tranzaction }} — {{ i.amount }}</p>
        <p class="text">{{i.info }}</p>
        <hr class="line">
    {% endfor %}
    <a class="link" href="/home">На главную</a>
</body>
</html>
