{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="page">
     <h1 class="title">Registration</h1>   
    <form class="form" method="post">
        {% csrf_token %}
        <input class="field" type="text" name="username" placeholder="Username...">
        <input class="field" type="password" name="password" placeholder="Password...">
        <input class="field" type="email" name="email" placeholder="Email...">
        <button class="button" type="submit">Registration</button>
    </form>
    <button class="button"> <a class="link" href="login"> Login </a> </button>



    
</body>
</html>
