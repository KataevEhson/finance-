{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Уменьшить баланс</title>
</head>
<body class="page">
    <h1 class="title">Уменьшить баланс</h1>
    <form class="form" method="post">
        {% csrf_token %}
        <select class="field" name="wallet" required>
            {% for i in wallets %}
            <option value="{{ i.id }}">Кошелёк номер {{ i.id }}</option>
            {% endfor %}
        </select>
        <input class="field" type="number" name="amount"  placeholder="Сумма снатия" required>
        <button class="button" type="submit">Снять</button>
    </form>
</body>
</html>
